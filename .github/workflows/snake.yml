name: Contribution snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#5c8a2e&color_dots=#ebedf0,#d7e8b8,#b5d27f,#8fb35d,#5c8a2e
            dist/snake-dark.svg?palette=github-dark&color_snake=#9BC16B&color_dots=#161b22,#2d4220,#4a6b2c,#76a346,#9BC16B
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
